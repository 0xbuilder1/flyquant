<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:image" content="/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/banner.png">
<title>FLYQUANT — a fruit fly's connectome, trading</title>
<meta name="description" content="165,836 neurons of a real fruit fly, trading a funded account on Lighter. Every position public, every fill verifiable.">
<style>
  /* ── a research tool, not a light show ──────────────────────────────────────────────
     Neutral ground, near-white ink, hairline rules, one accent. Colour carries meaning
     and nothing else: green and red mean direction of money, amber means the animal.
     No glow, no scanlines — the data is the decoration.                                */
  :root{
    --bg:#0b0c0e; --panel:#101215; --sunk:#08090b;
    --line:#1c1f24; --line2:#2a2e35;
    --ink:#e9eaec; --dim:#8d939b; --faint:#5a6067;
    --up:#3fb950; --down:#f85149; --fly:#d99a2b;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
  a:hover{border-color:var(--dim)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--sunk)}
  ::-webkit-scrollbar-thumb{background:#23272d}

  .wrap{max-width:1360px;margin:0 auto;padding:0 26px}

  /* header */
  header{border-bottom:1px solid var(--line);padding:15px 0 14px;margin-bottom:30px}
  .hrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .mark{font:600 15px/1 var(--sans);letter-spacing:.14em}
  .mark i{color:var(--fly);font-style:normal}
  .tag{color:var(--dim);font-size:12.5px}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;
    letter-spacing:.09em;text-transform:uppercase}
  .live .pip{width:6px;height:6px;border-radius:50%;background:var(--up)}
  .live.stale .pip{background:var(--faint)}

  /* section titles: a rule with a word on it */
  h2{font:500 10.5px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
    margin:0 0 14px;display:flex;align-items:center;gap:12px}
  h2::after{content:'';flex:1;height:1px;background:var(--line)}
  h2 em{font-style:normal;color:var(--dim);letter-spacing:.04em;text-transform:none;font-size:11px}

  /* ── the hero: what it is worth, and the shape of getting there ── */
  .hero{margin-bottom:34px}
  .headline{display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap;margin-bottom:4px}
  .value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:64px;line-height:.95;
    font-weight:500;letter-spacing:-.035em}
  .delta{display:flex;flex-direction:column;gap:2px;padding-bottom:7px}
  .delta .d1{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
  .delta .d2{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  .statline{display:flex;gap:30px;flex-wrap:wrap;margin:14px 0 16px}
  .statline div{display:flex;flex-direction:column;gap:3px}
  .statline b{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .statline span{font-size:10.5px;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
  #curve{display:block;width:100%;height:300px}
  .curvefoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
    color:var(--faint);border-top:1px solid var(--line);padding-top:7px;margin-top:-4px}

  /* ── positions ── */
  .cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:38px;margin-bottom:34px}
  @media(max-width:940px){.cols{grid-template-columns:1fr;gap:30px}}
  .pos{display:grid;grid-template-columns:1fr;gap:0}
  .p{display:grid;grid-template-columns:76px 1fr 88px 78px;align-items:center;gap:12px;
    padding:9px 0;border-bottom:1px solid var(--line)}
  .p:last-child{border-bottom:0}
  .p .sym{font-family:var(--mono);font-size:13.5px;font-weight:500}
  .p .sd{font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  .bar{height:3px;background:var(--line2);position:relative}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--dim)}
  .bar.long i{background:var(--up);opacity:.75}
  .bar.short i{background:var(--down);opacity:.75}
  .p .n{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .p .pl{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--faint);font-size:12px;padding:10px 0}

  /* ── the animal, now a supporting figure ── */
  .fig{position:relative;background:var(--sunk);border:1px solid var(--line)}
  #cloud{display:block;width:100%;height:260px;cursor:crosshair}
  .figover{position:absolute;left:12px;bottom:10px;right:12px;pointer-events:none;
    font-family:var(--mono);font-size:10px;color:var(--faint);display:flex;justify-content:space-between}
  .figover b{color:var(--dim);font-weight:400}
  .orbit{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .orbit i{position:absolute;font-style:normal;font-family:var(--mono);font-size:9px;
    transform:translate(-50%,-50%);white-space:nowrap;color:var(--faint)}
  .orbit i.pick{color:var(--fly)} .orbit i.loom{color:var(--down)}

  .verdict{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .verdict .act{font-family:var(--mono);font-size:19px;font-weight:500}
  .verdict .sym{font-family:var(--mono);font-size:19px;color:var(--ink)}
  .why{color:var(--faint);font-size:11.5px;margin-top:5px;font-family:var(--mono)}
  .drives{display:grid;gap:5px;margin-top:14px}
  .dr{display:grid;grid-template-columns:66px 1fr 44px;align-items:center;gap:10px;font-size:11px}
  .dr span{color:var(--dim);font-family:var(--mono)}
  .dr .t{height:2px;background:var(--line2)}
  .dr .t i{display:block;height:100%;background:var(--dim)}
  .dr.on .t i{background:var(--fly)} .dr.on span{color:var(--ink)}
  .dr .hz{font-family:var(--mono);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}

  /* ── tape ── */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  thead th{text-align:left;font:500 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);padding:0 12px 9px 0;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap}
  td.r{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#0e1013}
  td .sym{color:var(--ink)}
  .buy{color:var(--up)} .sell{color:var(--down)}
  .st{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--line2);padding:1px 5px}
  .st.sent,.st.filled{color:var(--up);border-color:#1d3b25}
  .st.refused{color:var(--down);border-color:#3d2020}
  .scroll{max-height:420px;overflow:auto}

  footer{border-top:1px solid var(--line);margin-top:36px;padding:18px 0 60px;color:var(--faint);font-size:11px}
  footer p{margin:0 0 8px;max-width:76ch;line-height:1.6}
  footer b{color:var(--dim);font-weight:500}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hrow">
      <span class="mark"><i>FLY</i>QUANT</span>
      <span class="tag">a fruit fly's connectome, trading a funded account</span>
      <span class="live" id="live"><span class="pip"></span><span id="liveText">connecting</span></span>
    </div>
  </header>

  <!-- what it is worth -->
  <section class="hero">
    <div class="headline">
      <div class="value num" id="value">—</div>
      <div class="delta">
        <div class="d1" id="dAbs">—</div>
        <div class="d2" id="dLabel">since the first pass</div>
      </div>
    </div>
    <div class="statline" id="stats"></div>
    <canvas id="curve"></canvas>
    <div class="curvefoot"><span id="cFrom"></span><span id="cTo"></span></div>
  </section>

  <div class="cols">
    <section>
      <h2>Positions <em id="posCount"></em></h2>
      <div class="pos" id="positions"></div>
    </section>

    <section>
      <h2>The animal</h2>
      <div class="fig">
        <canvas id="cloud"></canvas>
        <div class="orbit" id="orbit"></div>
        <div class="figover"><span id="figL"></span><span id="figR">drag to rotate</span></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="why" id="why"></div>
      <div class="drives" id="drives"></div>
    </section>
  </div>

  <section>
    <h2>Tape <em id="tapeNote"></em></h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>time</th><th>side</th><th>market</th><th class="r">size</th><th class="r">notional</th>
          <th class="r">price</th><th>route</th><th>status</th><th></th><th></th>
        </tr></thead>
        <tbody id="feed"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => n == null ? '—' : Math.round(n).toLocaleString();
const usd = (x) => (x < 0 ? '−' : '') + '$' + Math.abs(Number(x) || 0).toLocaleString(undefined,
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sign = (x) => (x > 0 ? 'up' : x < 0 ? 'down' : 'flat');

let orbit = { labels: [], chosen: null, heading: 0, bands: 72, front: 36 };
let latest = null, activityUrl = 'activity.bin', bins = 30;

/* ── the animal, in three dimensions ─────────────────────────────────────────────────
   139,600 real cell bodies. Muted here on purpose: it is the identity of the thing, not
   the point of the page, and it has to sit next to numbers without shouting over them. */
const GL = (() => {
  const cv = $('#cloud');
  const gl = cv.getContext('webgl', { alpha: false, antialias: false });
  if (!gl) return null;
  const VS = `
    attribute vec3 pos; attribute vec2 act;
    uniform float yaw, pitch, tBin, zoom, aspect, fade;
    varying float v; varying float amt;
    void main(){
      float cy=cos(yaw), sy=sin(yaw);
      vec3 p = vec3(pos.x*cy + pos.z*sy, pos.y, -pos.x*sy + pos.z*cy);
      float cp=cos(pitch), sp=sin(pitch);
      p = vec3(p.x, p.y*cp - p.z*sp, p.y*sp + p.z*cp);
      float z = p.z*0.55 + 2.1/zoom;
      gl_Position = vec4(p.x/aspect, p.y, 0.0, z);
      float first = act.y*255.0;
      float age = tBin - first;
      v = (first > 200.0 || age < 0.0) ? 0.0 : clamp(1.0 - age/fade, 0.0, 1.0);
      amt = clamp(act.x*255.0/70.0, 0.0, 1.0);
      gl_PointSize = (1.0 + v*2.4) / z * 2.0;
    }`;
  const FS = `
    precision mediump float; varying float v; varying float amt;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      vec3 base = vec3(0.28,0.34,0.42);
      vec3 hot  = mix(vec3(0.62,0.72,0.82), vec3(0.94,0.66,0.17), amt);
      gl_FragColor = vec4(mix(base, hot, v), 0.20 + v*0.72);
    }`;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const bp=gl.createBuffer(), ba=gl.createBuffer();
  const aPos=gl.getAttribLocation(prog,'pos'), aAct=gl.getAttribLocation(prog,'act');
  const U=(n)=>gl.getUniformLocation(prog,n);
  const u={yaw:U('yaw'),pitch:U('pitch'),tBin:U('tBin'),zoom:U('zoom'),aspect:U('aspect'),fade:U('fade')};
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.disable(gl.DEPTH_TEST);
  let count = 0;
  return {
    setPositions(i16){ count=i16.length/3; gl.bindBuffer(gl.ARRAY_BUFFER,bp);
      gl.bufferData(gl.ARRAY_BUFFER,i16,gl.STATIC_DRAW);
      gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,3,gl.SHORT,true,0,0); },
    setActivity(u8){ gl.bindBuffer(gl.ARRAY_BUFFER,ba);
      gl.bufferData(gl.ARRAY_BUFFER,u8,gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(aAct); gl.vertexAttribPointer(aAct,2,gl.UNSIGNED_BYTE,true,0,0); },
    draw(st){
      const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.clientWidth, h=cv.clientHeight;
      if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;}
      gl.viewport(0,0,cv.width,cv.height);
      gl.clearColor(0.031,0.035,0.043,1); gl.clear(gl.COLOR_BUFFER_BIT);
      if(!count) return;
      gl.uniform1f(u.yaw,st.yaw); gl.uniform1f(u.pitch,st.pitch); gl.uniform1f(u.tBin,st.tBin);
      gl.uniform1f(u.zoom,st.zoom); gl.uniform1f(u.aspect,w/h); gl.uniform1f(u.fade,st.fade);
      gl.drawArrays(gl.POINTS,0,count);
    },
    get count(){ return count; },
  };
})();

const view = { yaw:0, pitch:0.18, zoom:1.75, tBin:0, fade:7, drag:null };
if (GL) {
  const cv = $('#cloud');
  cv.addEventListener('pointerdown',(e)=>{view.drag={x:e.clientX,y:e.clientY,yaw:view.yaw,pitch:view.pitch};cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',(e)=>{ if(!view.drag)return;
    view.yaw=view.drag.yaw+(e.clientX-view.drag.x)*0.006;
    view.pitch=Math.max(-1.4,Math.min(1.4,view.drag.pitch+(e.clientY-view.drag.y)*0.006)); });
  addEventListener('pointerup',()=>{view.drag=null;});
}
function frame(){
  if (GL) { if(!view.drag) view.yaw += 0.0011; view.tBin=(view.tBin+0.11)%(bins+9); GL.draw(view); placeOrbit(); }
  requestAnimationFrame(frame);
}
frame();

/* ── the curve: what the account has been worth ──────────────────────────────────── */
function drawCurve(pts) {
  const c = $('#curve');
  if (!c) return;
  if (c.clientWidth < 10) { requestAnimationFrame(() => drawCurve(pts)); return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = c.clientWidth, H = 300;
  c.width = W*dpr; c.height = H*dpr;
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);

  const PAD_R = 66, PAD_B = 22, PAD_T = 14;
  if (!pts || pts.length < 2) {
    x.fillStyle = '#5a6067'; x.font = '12px ui-monospace,monospace';
    x.fillText(pts && pts.length === 1 ? 'one point so far — the curve needs a second pass' : 'no history yet', 0, H/2);
    $('#cFrom').textContent = ''; $('#cTo').textContent = '';
    return;
  }
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  // A perfectly flat series has no range to scale to. Inventing one and then filling the area under
  // it paints half the panel a solid colour and reads as a chart that is doing something, which it
  // is not: the account simply has not moved.
  const flat = (hi - lo) < 1e-9;
  if (flat) { hi = hi * 1.0006 + 0.01; lo = lo * 0.9994 - 0.01; }
  const pad = (hi-lo)*0.14; lo -= pad; hi += pad;
  const plotW = W - PAD_R, plotH = H - PAD_B - PAD_T;
  const px = (i)=> (i/(pts.length-1))*plotW;
  const py = (v)=> PAD_T + (1-(v-lo)/(hi-lo))*plotH;

  // horizontal grid + right-hand scale: four lines, quietly
  x.font = '10px ui-monospace,monospace'; x.textBaseline = 'middle';
  for (let k=0;k<=4;k++){
    const v = lo + (hi-lo)*k/4, y = py(v);
    x.strokeStyle = '#16181c'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(0,Math.round(y)+.5); x.lineTo(plotW,Math.round(y)+.5); x.stroke();
    x.fillStyle = '#5a6067';
    x.fillText('$' + v.toFixed(2), plotW + 10, y);
  }

  const first = vals[0], last = vals[vals.length-1];
  const rising = last >= first;
  const col = rising ? '63,185,80' : '248,81,73';

  // the opening level, so the whole shape is read against where it started
  x.setLineDash([2,4]); x.strokeStyle='#2a2e35'; x.lineWidth=1;
  x.beginPath(); x.moveTo(0,py(first)); x.lineTo(plotW,py(first)); x.stroke(); x.setLineDash([]);

  x.beginPath();
  pts.forEach((p,i)=> i ? x.lineTo(px(i),py(p.v)) : x.moveTo(px(i),py(p.v)));
  x.lineTo(px(pts.length-1), H-PAD_B); x.lineTo(0, H-PAD_B); x.closePath();
  const g = x.createLinearGradient(0,PAD_T,0,H-PAD_B);
  g.addColorStop(0,`rgba(${col},${flat ? 0.03 : 0.13})`); g.addColorStop(1,`rgba(${col},0)`);
  x.fillStyle = g; x.fill();

  x.beginPath();
  pts.forEach((p,i)=> i ? x.lineTo(px(i),py(p.v)) : x.moveTo(px(i),py(p.v)));
  x.strokeStyle = flat ? '#5a6067' : `rgb(${col})`; x.lineWidth = 1.5; x.lineJoin='round'; x.stroke();

  x.beginPath(); x.arc(px(pts.length-1), py(last), 2.5, 0, 7);
  x.fillStyle = flat ? '#5a6067' : `rgb(${col})`; x.fill();
  if (flat) {
    x.fillStyle = '#5a6067'; x.font = '11px ui-monospace,monospace'; x.textBaseline = 'alphabetic';
    x.fillText('unchanged — nothing has traded yet', 4, py(last) - 12);
  }

  const when = (t)=> new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  $('#cFrom').textContent = when(pts[0].t);
  $('#cTo').textContent = when(pts[pts.length-1].t) + '  ·  ' + pts.length + ' passes';
}

/* ── positions, biggest first ─────────────────────────────────────────────────────── */
function renderPositions(s) {
  const a = s.account || {};
  const host = $('#positions');
  if (a.error) { host.innerHTML = `<div class="empty">${a.error}</div>`; $('#posCount').textContent=''; return; }
  const ps = (a.positions || []).slice().sort((p,q)=>Math.abs(q.notional)-Math.abs(p.notional));
  $('#posCount').textContent = ps.length ? `${ps.length} open · ${usd(a.exposure)} at work` : '';
  if (!ps.length) { host.innerHTML = `<div class="empty">no open positions</div>`; return; }
  const biggest = Math.abs(ps[0].notional) || 1;
  host.innerHTML = ps.map((p)=>{
    const w = Math.max(2, (Math.abs(p.notional)/biggest)*100);
    return `<div class="p">
      <div><div class="sym">${p.symbol}</div><div class="sd">${p.side}</div></div>
      <div class="bar ${p.side}"><i style="width:${w}%"></i></div>
      <div class="n">${usd(Math.abs(p.notional))}</div>
      <div class="pl ${sign(p.unrealized)}">${p.unrealized>=0?'+':''}${usd(p.unrealized)}</div>
    </div>`;
  }).join('');
}

/* ── the fly's current call ───────────────────────────────────────────────────────── */
function renderFly(s) {
  const p = s.pass;
  const act = p.action;
  const cls = act==='long'?'up':(act==='short'||act==='escape')?'down':'flat';
  $('#verdict').innerHTML = `<span class="act ${cls}">${act.toUpperCase()}</span>` +
    (act==='hold'?'':` <span class="act ${cls}">${(p.size*100).toFixed(0)}%</span>`) +
    (p.chosen?` <span class="sym">${p.chosen}</span>`:'');
  $('#why').textContent = p.why;

  const rows = [['escape','LPLC2'],['feed','MN9'],['retreat','MDN'],['freeze','DNp09'],['steer','DNa02']];
  const max = Math.max(...rows.map(([k])=>p.rates[k].hz), 1);
  $('#drives').innerHTML = rows.map(([k,t])=>{
    const r = p.rates[k], w = Math.max(0,Math.min(100,(r.hz/max)*100));
    return `<div class="dr ${r.hz>0?'on':''}"><span>${t}</span>
      <div class="t"><i style="width:${w}%"></i></div>
      <div class="hz">${r.hz.toFixed(0)}Hz</div></div>`;
  }).join('');

  const b = s.brain;
  $('#figL').innerHTML = `<b>${fmt(b.placedNeurons)}</b> cell bodies · <b>${fmt(p.fired)}</b> fired this pass`;
}

/* ── the ring of markets around the animal ────────────────────────────────────────── */
function buildOrbit(s) {
  const host = $('#orbit'); if (!host) return;
  const rows = s.pass.markets || [];
  host.innerHTML = rows.map((m)=>`<i>${m.symbol}</i>`).join('');
  orbit.labels = [...host.querySelectorAll('i')].map((el,k)=>({el,m:rows[k]}));
  orbit.bands = s.arena.bands; orbit.front = s.arena.front;
  orbit.chosen = s.pass.chosen; orbit.heading = s.pass.heading;
  for (const {el,m} of orbit.labels)
    el.className = m.symbol===orbit.chosen ? 'pick' : (m.fall>0.02 ? 'loom' : '');
}
function placeOrbit() {
  const host = $('#orbit'); if (!host || !orbit.labels.length) return;
  const w = host.clientWidth, h = host.clientHeight; if (w < 10) return;
  const cx=w/2, cy=h/2, rx=Math.min(w*0.44,470), ry=Math.min(h*0.40,120);
  for (const {el,m} of orbit.labels) {
    const a = ((m.seat - orbit.heading - orbit.front)/orbit.bands)*Math.PI*2 - Math.PI/2 + view.yaw;
    el.style.left = (cx + Math.cos(a)*rx).toFixed(1)+'px';
    el.style.top  = (cy + Math.sin(a)*ry*0.8).toFixed(1)+'px';
    const depth = (Math.sin(a)+1)/2;
    el.style.opacity = (0.13 + (0.3 + m.bright*0.7)*(0.35+depth*0.5)).toFixed(2);
  }
}

/* ── the tape ─────────────────────────────────────────────────────────────────────── */
function renderFeed(s) {
  const rows = (s.feed || []).slice().sort((a,z)=>z.at-a.at).slice(0,100);
  const tb = $('#feed');
  if (!rows.length) { tb.innerHTML = `<tr><td colspan="10" style="color:var(--faint);padding:14px 0">nothing yet — a line is written every pass</td></tr>`; return; }
  tb.innerHTML = rows.map((f)=>{
    const d = new Date(f.at);
    const t = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    const px = f.fillPrice ?? f.limitPrice ?? f.mark;
    return `<tr>
      <td>${t}</td>
      <td class="${f.side||''}">${(f.side||f.action||'—').toUpperCase()}</td>
      <td><span class="sym">${f.symbol||'—'}</span></td>
      <td class="r">${f.sizeBase!=null?Number(f.sizeBase).toLocaleString(undefined,{maximumFractionDigits:4}):''}</td>
      <td class="r">${f.notional!=null?usd(f.notional):''}</td>
      <td class="r">${px!=null?Number(px).toPrecision(6):''}</td>
      <td>${f.execution==='post-only'?'rest':f.execution==='market'?'cross':''}</td>
      <td><span class="st ${f.status}">${f.status}</span></td>
      <td style="color:var(--faint)">${f.note||''}</td>
      <td>${f.verify?`<a href="${f.verify}" target="_blank" rel="noopener">verify</a>`:''}</td>
    </tr>`;
  }).join('');
  $('#tapeNote').textContent = s.trade ? (s.trade.live ? 'live · armed' : 'live trading disarmed') : '';
}

/* ── head ─────────────────────────────────────────────────────────────────────────── */
function renderHead(s) {
  const a = s.account || {}, c = s.equityCurve || [];
  if (a.error || !Number.isFinite(a.equity)) {
    $('#value').textContent = '—';
    $('#dAbs').textContent = ''; $('#dLabel').textContent = a.error || 'no account';
    $('#stats').innerHTML = ''; return;
  }
  $('#value').textContent = usd(a.equity);
  const base = c.length ? c[0].v : a.equity;
  const chg = a.equity - base, pct = base ? (chg/base)*100 : 0;
  $('#dAbs').className = 'd1 ' + sign(chg);
  $('#dAbs').textContent = `${chg>=0?'+':'−'}${usd(Math.abs(chg)).replace('$','$')}  ${chg>=0?'+':'−'}${Math.abs(pct).toFixed(2)}%`;
  $('#dLabel').textContent = c.length>1 ? `over ${c.length} passes` : 'since the first pass';

  const p = s.pass;
  $('#stats').innerHTML = [
    [usd(a.unrealized), 'unrealised', sign(a.unrealized)],
    [usd(a.exposure), 'exposure'],
    [((a.utilisation||0)*100).toFixed(0)+'%', 'of equity at work'],
    [String(a.positions.length), 'positions'],
    [p.chosen || '—', 'facing'],
  ].map(([v,k,cl])=>`<div><b class="${cl||''}">${v}</b><span>${k}</span></div>`).join('');
}

/* ── data ─────────────────────────────────────────────────────────────────────────── */
let last = 0, cloudLoaded = false;
async function loadCloud(){
  if (cloudLoaded || !GL) return;
  try { const r = await fetch('cloud-xyz.bin'); if(!r.ok) throw 0;
    GL.setPositions(new Int16Array(await r.arrayBuffer())); cloudLoaded = true; } catch(e){}
}
function age(s){
  const secs = Math.round((Date.now()-s.pass.at)/1000);
  $('#live').classList.toggle('stale', secs>420);
  $('#liveText').textContent = secs<90 ? `live · ${secs}s ago` : `last pass ${Math.round(secs/60)}m ago`;
}
async function tick(){
  let s;
  try {
    let r = await fetch('/api/stats?t='+Date.now(),{cache:'no-store'}).catch(()=>null);
    if (!r || !r.ok) r = await fetch('stats.json?t='+Date.now(),{cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    s = await r.json();
    if (s.activityUrl) activityUrl = s.activityUrl;
  } catch(e){
    $('#live').classList.add('stale'); $('#liveText').textContent='no data'; return;
  }
  await loadCloud();
  if (s.pass.at !== last) {
    last = s.pass.at; latest = s; bins = s.pass.bins || 30;
    renderHead(s); drawCurve(s.equityCurve); renderPositions(s); renderFly(s); buildOrbit(s); renderFeed(s);
    const b = s.brain;
    $('#foot').innerHTML =
      `<p><b>This is a wiring diagram, not a mind.</b> ${fmt(b.neurons)} neurons and ${fmt(b.edges)} connections
       from a real animal, simulated with published constants. It is not conscious, it does not know what money is,
       and it has not learned anything — a connectome is one frozen snapshot of synaptic weights, so the fly reacts
       to what is in front of it and nothing more.</p>
      <p>Connections below ${b.minWeight} synapses are dropped, where reconstruction error concentrates.
       Escape is read from <b>LPLC2</b> rather than the giant fiber, which never leaves noise on this input and is
       published anyway: <b>${s.pass.rates.giantFiber.spikes}</b> spikes this pass. Same seed, same market, same
       spikes — this pass was seed <b>${s.pass.seed}</b>.</p>
      <p>${b.dataset} — ${b.attribution} Dynamics after Shiu et al. (2024).
       Every position and every fill is public: the figures above are read from the exchange, not asserted here.</p>`;
    try { const r = await fetch(activityUrl+'?t='+s.pass.at,{cache:'no-store'});
      if (r.ok && GL) GL.setActivity(new Uint8Array(await r.arrayBuffer())); } catch(e){}
  }
  age(s);
}
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(latest){drawCurve(latest.equityCurve);} },140);});
tick(); setInterval(tick, 4000);
</script>
